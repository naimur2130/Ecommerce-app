name: Build My React App

on: 
  push:
    branches: [ main ]


jobs:
  build-react-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0
      - name: Setup Node JS
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm install
        
      - name: Build React App
        working-directory: ./Frontend
        run: npm run build
    
